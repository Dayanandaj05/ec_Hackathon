<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>kalanjiam</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <h1>📁 kalanjiam</h1>
      <input type="text" id="username" placeholder="Username" />
      <input type="password" id="password" placeholder="Password" />
      <button onclick="login()">Sign In</button>
      <p id="login-error" class="error"></p>
    </div>
  </div>

  <div id="app" class="hidden">
    <div class="sidebar">
      <div class="logo">📁 kalanjiam</div>
      <div class="user-info" id="user-info"></div>
      <div class="sidebar-item" onclick="navigateTo(null, 'My Drive')">🏠 My Drive</div>
      <div id="admin-nav" class="sidebar-item hidden" onclick="openAdminPanel()">🛠 Admin Panel</div>
      <hr/>
      <div id="sidebar-folders"></div>
      <hr/>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>
    <div class="main">
      <div class="topbar">
        <div class="breadcrumb" id="breadcrumb">My Drive</div>
        <select id="size-unit-select" title="Size display unit">
          <option value="auto">Auto</option>
          <option value="bytes">Bytes</option>
          <option value="kb">KB</option>
          <option value="mb">MB</option>
          <option value="gb">GB</option>
          <option value="tb">TB</option>
        </select>
        <input type="text" id="search-input" placeholder="🔍 Search files..." oninput="handleSearch(this.value)" />
      </div>
      <div class="quota-section" id="quota-section">
        <div class="quota-label" id="quota-label">Loading storage...</div>
        <div class="quota-track"><div class="quota-fill" id="quota-fill"></div></div>
      </div>
      <div class="toolbar" id="toolbar">
        <button class="btn-primary" onclick="triggerUpload()">⬆ Upload File</button>
        <button class="btn-secondary" onclick="createFolder()">📁 New Folder</button>
        <input type="file" id="file-input" style="display:none" onchange="uploadFile(this.files[0])" />
      </div>
      <div id="file-grid" class="file-grid"></div>
      <div id="admin-panel" class="admin-panel hidden"></div>
    </div>
  </div>

  <div id="preview-modal" class="modal hidden" onclick="closePreview(event)">
    <div class="modal-box">
      <button class="modal-close" onclick="closePreview()">✕</button>
      <div id="preview-content"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
